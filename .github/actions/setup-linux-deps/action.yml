name: Setup Linux Dependencies
description: Install Linux build and analysis dependencies for DroneSwarm CI
runs:
  using: composite
  steps:
    - name: Install apt dependencies
      shell: bash
      run: |
        set -euxo pipefail
        # The hosted image may redirect apt through a region-specific AWS or
        # Azure mirror. Cross-region EC2 mirrors have repeatedly stalled the
        # 500+ package PCL/OpenCV dependency transaction for up to 90 minutes.
        # Normalize both the image's apt-mirrors.txt indirection and any
        # ordinary source entries to Ubuntu's official HTTPS archive.
        for sources in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
          if [[ -f "$sources" ]]; then
            sudo sed -E -i \
              -e 's@https?://azure\\.archive\\.ubuntu\\.com/ubuntu@https://archive.ubuntu.com/ubuntu@g' \
              -e 's@https?://[[:alnum:]-]+\\.ec2\\.archive\\.ubuntu\\.com/ubuntu@https://archive.ubuntu.com/ubuntu@g' \
              "$sources"
          fi
        done
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=45 \
          -o Acquire::https::Timeout=45 update
        sudo env DEBIAN_FRONTEND=noninteractive apt-get \
          -o Acquire::Retries=3 -o Acquire::http::Timeout=45 \
          -o Acquire::https::Timeout=45 install -y --no-install-recommends \
          build-essential \
          clang \
          clang-format \
          clang-tidy \
          cmake \
          curl \
          git \
          golang-go \
          libeigen3-dev \
          libopencv-dev \
          libomp-dev \
          libpcl-dev \
          libspdlog-dev \
          libopenmpi-dev \
          ninja-build \
          openmpi-bin \
          pkg-config \
          python3-dev \
          python3-pip \
          python3-venv
