name: EuRoC Sensor Calibration Geometry Regression

on:
  pull_request:
    paths:
      - "research/experiments/euroc_calibration_validation.py"
      - "tests/test_euroc_calibration_validation.py"
      - "docs/research/EUROC_CALIBRATION_FRAME_PROTOCOL.md"
      - ".github/workflows/euroc-calibration-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-calibration-regression:
    name: EuRoC T_BS geometry and YAML validation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install strict calibration dependencies
        run: python -m pip install "numpy>=2.3,<3" "PyYAML>=6.0.3,<7"
      - name: Run synthetic calibration regression suite
        run: python -m unittest tests.test_euroc_calibration_validation -v
      - name: Compile audit module and tests
        run: |
          python -m py_compile research/experiments/euroc_calibration_validation.py
          python -m py_compile tests/test_euroc_calibration_validation.py
      - name: Scientific integrity notice
        run: |
          echo "Synthetic YAML calibration tests only."
          echo "No genuine EuRoC sequences, VIO trajectories, or ATE results were evaluated."
