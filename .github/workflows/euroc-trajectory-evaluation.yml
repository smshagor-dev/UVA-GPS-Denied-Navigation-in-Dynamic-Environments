name: EuRoC Trajectory Evaluator Regression

on:
  pull_request:
    paths:
      - "research/experiments/euroc_trajectory_evaluation.py"
      - "tests/test_euroc_trajectory_evaluation.py"
      - "docs/research/EUROC_TRAJECTORY_EVALUATION_PROTOCOL.md"
      - ".github/workflows/euroc-trajectory-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-fixture-regression:
    name: EuRoC evaluator parser and metric unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install evaluation dependency
        run: python -m pip install "numpy>=2.3,<3"
      - name: Verify trajectory parser and rigid alignment with synthetic fixtures
        run: python -m unittest tests.test_euroc_trajectory_evaluation -v
      - name: Compile evaluator source
        run: python -m py_compile research/experiments/euroc_trajectory_evaluation.py
      - name: Evidence boundary
        run: |
          echo "These unit tests use synthetic fixture trajectories only."
          echo "No EuRoC sensor dataset was downloaded or evaluated in this CI job."
