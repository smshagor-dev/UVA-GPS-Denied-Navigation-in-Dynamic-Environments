name: Visual Feature Track Ingest Validation

on:
  push:
    branches:
      - visual-feature-track-ingest
    paths:
      - '.github/workflows/shadow-only-feature-ingest.yml'
      - 'include/vio/VisualFeatureTrackManager.hpp'
      - 'include/vio/VIOPipeline.hpp'
      - 'src/vio/VIOPipeline.cpp'
      - 'tests/test_visual_feature_track_manager.cpp'
      - 'tests/test_visual_feature_track_ingest.cpp'
      - 'tests/visual_feature_track_ingest_replay.cpp'
      - 'tests/test_shadow_only_measurement.cpp'
      - 'tests/CMakeLists.txt'
  pull_request:
    branches:
      - msckf-camera-state-marginalization
    paths:
      - 'include/vio/VisualFeatureTrackManager.hpp'
      - 'include/vio/VIOPipeline.hpp'
      - 'src/vio/VIOPipeline.cpp'
      - 'tests/test_visual_feature_track_manager.cpp'
      - 'tests/test_visual_feature_track_ingest.cpp'
      - 'tests/visual_feature_track_ingest_replay.cpp'
      - 'tests/test_shadow_only_measurement.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/shadow-only-feature-ingest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-feature-track-ingest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gcc:
    name: GCC feature ingest
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-linux-deps
      - name: Tool versions
        run: |
          set -euxo pipefail
          gcc --version
          g++ --version
          cmake --version
          ninja --version
      - name: Configure
        run: cmake --preset linux-gcc-release-minimal
      - name: Build focused targets
        run: >-
          cmake --build --preset linux-gcc-release-minimal
          --target test_visual_feature_track_manager test_visual_feature_track_ingest
          test_shadow_only_measurement visual_feature_track_ingest_replay -- -j2
      - name: Run focused tests
        run: >-
          ctest --test-dir build/linux-gcc-release-minimal
          --output-on-failure
          -L 'visual-feature-tracking|shadow-only'

  clang:
    name: Clang feature ingest
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-linux-deps
      - name: Tool versions
        run: |
          set -euxo pipefail
          clang --version
          clang++ --version
          cmake --version
          ninja --version
      - name: Configure
        run: cmake --preset linux-clang-release
      - name: Build focused targets
        run: >-
          cmake --build --preset linux-clang-release
          --target test_visual_feature_track_manager test_visual_feature_track_ingest
          test_shadow_only_measurement visual_feature_track_ingest_replay -- -j2
      - name: Run focused tests
        run: >-
          ctest --test-dir build/linux-clang-release
          --output-on-failure
          -L 'visual-feature-tracking|shadow-only'

  acceptance:
    name: Visual ingest acceptance
    runs-on: ubuntu-24.04
    needs: [gcc, clang]
    steps:
      - run: echo 'Visual feature tracking, deterministic replay, and shadow-only authority tests passed.'
