name: EuRoC Independent 6-DoF Pose Evaluation

on:
  pull_request:
    paths:
      - "research/experiments/euroc_pose_evaluation.py"
      - "tests/test_euroc_pose_evaluation.py"
      - "docs/research/EUROC_6DOF_EVALUATION_PROTOCOL.md"
      - ".github/workflows/euroc-pose-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-pose-evaluation:
    name: Independent EuRoC pose evaluation synthetic regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install numerical and formatting dependencies
        run: python -m pip install "numpy>=2.3,<3" black==24.10.0
      - name: Check Python formatting
        run: python -m black --check --diff research/experiments/euroc_pose_evaluation.py tests/test_euroc_pose_evaluation.py
      - name: Run original position evaluator and new 6-DoF synthetic tests
        run: |
          python -m unittest tests.test_euroc_trajectory_evaluation -v
          python -m unittest tests.test_euroc_pose_evaluation -v
      - name: Compile independent evaluation sources
        run: |
          python -m py_compile research/experiments/euroc_pose_evaluation.py
          python -m py_compile tests/test_euroc_pose_evaluation.py
      - name: Scope of evidence
        run: |
          echo "Only synthetic trajectories were used in this CI run."
          echo "No publisher EuRoC data, hardware flights or published SOTA results."
