name: Black Diagnostic

on:
  push:
    branches:
      - fix/ci-python-static-analysis
  workflow_dispatch:

permissions:
  contents: write

jobs:
  black:
    if: github.ref == 'refs/heads/fix/ci-python-static-analysis'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ci-python-static-analysis
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install CI Black
        run: python3 -m pip install black==24.10.0
      - name: Apply production Black formatting
        shell: bash
        run: python3 -m black main.py gui tests scripts
      - name: Commit formatted Python sources when needed
        shell: bash
        run: |
          if git diff --quiet -- main.py gui tests scripts; then
            echo "Black formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- main.py gui tests scripts
          git commit -m "style: apply Black 24.10.0 formatting"
          git push origin HEAD:fix/ci-python-static-analysis
