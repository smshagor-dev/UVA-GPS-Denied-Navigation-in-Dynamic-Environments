name: MSCKF Marginalization Validation

on:
  pull_request:
    branches:
      - phase22-final-validation
    paths:
      - 'include/vio/MsckfMarginalization.hpp'
      - 'include/vio/MsckfRetirementTransaction.hpp'
      - 'include/vio/EKFEstimator.hpp'
      - 'include/vio/StateEstimator.hpp'
      - 'src/vio/Phase17ESKFEstimator.cpp'
      - 'tests/CMakeLists.txt'
      - 'tests/test_msckf_marginalization.cpp'
      - 'tests/test_msckf_retirement_transaction.cpp'
      - 'tests/test_msckf_marginalization_integration.cpp'
      - 'tools/msckf_marginalization_smoke.cpp'
      - 'tools/msckf_retirement_transaction_smoke.cpp'
      - 'docs/msckf-camera-state-marginalization/**'
      - '.github/workflows/msckf-marginalization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invariants:
    name: GCC and Clang Invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install Eigen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libeigen3-dev
      - name: GCC warnings-as-errors invariant smoke
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Iinclude -I/usr/include/eigen3 tools/msckf_marginalization_smoke.cpp -o msckf_marginalization_smoke
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Iinclude -I/usr/include/eigen3 tools/msckf_retirement_transaction_smoke.cpp -o msckf_retirement_transaction_smoke
          ./msckf_marginalization_smoke
          ./msckf_retirement_transaction_smoke
      - name: Clang warnings-as-errors invariant smoke
        run: |
          clang++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Iinclude -I/usr/include/eigen3 tools/msckf_marginalization_smoke.cpp -o msckf_marginalization_smoke_clang
          clang++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Iinclude -I/usr/include/eigen3 tools/msckf_retirement_transaction_smoke.cpp -o msckf_retirement_transaction_smoke_clang
          ./msckf_marginalization_smoke_clang
          ./msckf_retirement_transaction_smoke_clang

  linux-gcc:
    name: Linux GCC Regression
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-linux-deps
      - name: Versions
        run: |
          gcc --version | head -n 1
          g++ --version | head -n 1
          cmake --version
      - name: Configure
        run: cmake --preset validation-linux-gcc
      - name: Build estimator regression targets
        run: |
          cmake --build --preset validation-linux-gcc --target \
            test_ekf test_phase16_shadow test_phase17_eskf test_phase18_zupt \
            test_phase19_fej test_phase20_msckf test_phase21_triangulation \
            test_phase22_msckf_update test_msckf_marginalization_integration \
            ekf_phase15_replay ekf_phase16_replay ekf_phase17_replay ekf_phase18_replay \
            ekf_phase19_replay ekf_phase20_replay ekf_phase21_replay ekf_phase22_replay -- -j2
      - name: Run estimator regressions
        run: |
          ctest --test-dir build/validation-linux-gcc --output-on-failure \
            -R 'EKFTest|Phase16|Phase17|Phase18|Phase19|Phase20|Phase21|Phase22|MsckfMarginalizationIntegration|ekf_phase(15|16|17|18|19|20|21|22)_replay'

  linux-clang:
    name: Linux Clang Regression
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-linux-deps
      - name: Versions
        run: |
          clang --version | head -n 1
          clang++ --version | head -n 1
          cmake --version
      - name: Configure
        run: cmake --preset linux-clang-release
      - name: Build estimator regression targets
        run: |
          cmake --build --preset linux-clang-release --target \
            test_ekf test_phase16_shadow test_phase17_eskf test_phase18_zupt \
            test_phase19_fej test_phase20_msckf test_phase21_triangulation \
            test_phase22_msckf_update test_msckf_marginalization_integration \
            ekf_phase15_replay ekf_phase16_replay ekf_phase17_replay ekf_phase18_replay \
            ekf_phase19_replay ekf_phase20_replay ekf_phase21_replay ekf_phase22_replay -- -j2
      - name: Run estimator regressions
        run: |
          ctest --test-dir build/linux-clang-release --output-on-failure \
            -R 'EKFTest|Phase16|Phase17|Phase18|Phase19|Phase20|Phase21|Phase22|MsckfMarginalizationIntegration|ekf_phase(15|16|17|18|19|20|21|22)_replay'

  werror:
    name: GCC and Clang Werror
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-linux-deps
      - name: GCC Werror
        run: |
          cmake --preset linux-gcc-release-werror
          cmake --build --preset linux-gcc-release-werror --target test_msckf_marginalization_integration test_phase22_msckf_update -- -j2
      - name: Clang Werror configure
        run: |
          cmake -S . -B build/linux-clang-release-werror -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DDRONE_WARNINGS_AS_ERRORS=ON -DDRONE_ENABLE_PYTHON_BINDINGS=OFF
      - name: Clang Werror build
        run: cmake --build build/linux-clang-release-werror --target test_msckf_marginalization_integration test_phase22_msckf_update -- -j2

  static-analysis:
    name: Format and Tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-linux-deps
      - name: Install formatter
        run: python3 -m pip install --upgrade clang-format==19.1.7
      - name: clang-format
        run: |
          clang-format --version
          clang-format --dry-run --Werror \
            include/vio/MsckfMarginalization.hpp \
            include/vio/MsckfRetirementTransaction.hpp \
            src/vio/Phase17ESKFEstimator.cpp \
            tests/test_msckf_marginalization.cpp \
            tests/test_msckf_retirement_transaction.cpp \
            tests/test_msckf_marginalization_integration.cpp \
            tools/msckf_marginalization_smoke.cpp \
            tools/msckf_retirement_transaction_smoke.cpp
      - name: Configure compile database
        run: cmake --preset linux-gcc-release-minimal
      - name: clang-tidy
        run: |
          clang-tidy --version
          clang-tidy src/vio/Phase17ESKFEstimator.cpp -p build/linux-gcc-release-minimal --warnings-as-errors='*'

  asan-ubsan:
    name: Clang ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-linux-deps
      - name: Configure
        run: cmake --preset linux-clang-asan-ubsan
      - name: Build focused sanitizer targets
        run: |
          cmake --build --preset linux-clang-asan-ubsan --target \
            test_phase22_msckf_update test_msckf_marginalization_integration \
            ekf_phase21_replay ekf_phase22_replay -- -j2
      - name: Run focused sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          ctest --test-dir build/linux-clang-asan-ubsan --output-on-failure \
            -R 'Phase22|MsckfMarginalizationIntegration|ekf_phase(21|22)_replay'

  tsan:
    name: Clang TSan Project-Owned Race Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-linux-deps
      - name: Configure
        run: cmake --preset linux-clang-tsan-phase17
      - name: Build focused TSan targets
        run: |
          cmake --build --preset linux-clang-tsan-phase17 --target \
            test_phase22_msckf_update test_msckf_marginalization_integration ekf_phase22_replay -- -j2
      - name: Disable ASLR for TSan runtime
        run: sudo sysctl -w kernel.randomize_va_space=0
      - name: Run TSan
        env:
          TSAN_OPTIONS: halt_on_error=1:exitcode=66
        run: |
          ctest --test-dir build/linux-clang-tsan-phase17 --output-on-failure \
            -R 'Phase22|MsckfMarginalizationIntegration|ekf_phase22_replay'

  windows-msvc:
    name: Windows MSVC and Werror
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-key-suffix: msckf-marginalization
      - name: MSVC Release configure
        shell: pwsh
        run: cmake --preset validation-msvc -DDRONE_ENABLE_PYTHON_BINDINGS=OFF
      - name: MSVC Release build
        shell: pwsh
        run: cmake --build --preset validation-msvc --target test_msckf_marginalization_integration test_phase22_msckf_update ekf_phase22_replay --parallel 2
      - name: MSVC Release tests
        shell: pwsh
        run: ctest --test-dir build/validation-msvc -C Release --output-on-failure -R 'Phase22|MsckfMarginalizationIntegration|ekf_phase22_replay'
      - name: MSVC Werror configure
        shell: pwsh
        run: cmake --preset windows-msvc-release-werror -DDRONE_ENABLE_PYTHON_BINDINGS=OFF
      - name: MSVC Werror build
        shell: pwsh
        run: cmake --build --preset windows-msvc-release-werror --target test_msckf_marginalization_integration test_phase22_msckf_update --parallel 2

  acceptance:
    name: MSCKF Marginalization Acceptance
    if: always()
    needs:
      - invariants
      - linux-gcc
      - linux-clang
      - werror
      - static-analysis
      - asan-ubsan
      - tsan
      - windows-msvc
    runs-on: ubuntu-24.04
    steps:
      - name: Require all validation lanes
        env:
          INVARIANTS: ${{ needs.invariants.result }}
          GCC: ${{ needs.linux-gcc.result }}
          CLANG: ${{ needs.linux-clang.result }}
          WERROR: ${{ needs.werror.result }}
          STATIC: ${{ needs.static-analysis.result }}
          SANITIZERS: ${{ needs.asan-ubsan.result }}
          TSAN: ${{ needs.tsan.result }}
          MSVC: ${{ needs.windows-msvc.result }}
        run: |
          for status in "$INVARIANTS" "$GCC" "$CLANG" "$WERROR" "$STATIC" "$SANITIZERS" "$TSAN" "$MSVC"; do
            test "$status" = success
          done
