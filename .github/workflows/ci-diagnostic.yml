name: CI Diagnostic

on:
  push:
    branches:
      - fix/ci-python-static-analysis
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-formatting-diagnostic:
    name: Python Formatting Diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install CI Black
        shell: bash
        run: python3 -m pip install black==24.10.0
      - name: Capture production Black output
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/ci-diagnostic"
          set -o pipefail
          python3 -m black --check --diff main.py gui tests scripts 2>&1 | tee "${RUNNER_TEMP}/ci-diagnostic/black.log"
      - name: Upload Black diagnostic log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: black-${{ github.sha }}
          path: ${{ runner.temp }}/ci-diagnostic/black.log
          if-no-files-found: error
          retention-days: 3

  static-analysis-diagnostic:
    name: Static Analysis Diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-linux-deps

      - name: Configure compile commands
        shell: bash
        run: cmake --preset linux-gcc-release-minimal

      - name: Run clang-tidy with captured output
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${RUNNER_TEMP}/ci-diagnostic"
          python3 scripts/run_clang_tidy.py --build-dir build/linux-gcc-release-minimal --changed-only 2>&1 | tee "${RUNNER_TEMP}/ci-diagnostic/clang-tidy.log"

      - name: Upload clang-tidy diagnostic log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-${{ github.sha }}
          path: ${{ runner.temp }}/ci-diagnostic/clang-tidy.log
          if-no-files-found: error
          retention-days: 3
