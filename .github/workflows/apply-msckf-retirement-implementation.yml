name: Apply MSCKF Retirement Implementation

on:
  push:
    branches:
      - phase23-development
    paths:
      - 'patches/msckf-retirement-implementation.patch'
      - '.github/workflows/apply-msckf-retirement-implementation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase23-development
          fetch-depth: 0
      - name: Apply production patch
        run: |
          git apply --check patches/msckf-retirement-implementation.patch
          git apply patches/msckf-retirement-implementation.patch
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/vio/EKFEstimator.hpp include/vio/Phase17ESKFEstimator.hpp src/vio/Phase17ESKFEstimator.cpp
          git commit -m "Complete MSCKF retirement implementation"
          git push origin HEAD:phase23-development
