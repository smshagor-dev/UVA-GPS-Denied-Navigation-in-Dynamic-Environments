name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - "CMakeLists.txt"
      - "CHANGELOG.md"
      - "RESEARCH_RELEASE.md"
      - "docs/releases/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-metadata:
    name: Release Metadata Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Validate project version and release metadata
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          cmake = Path("CMakeLists.txt").read_text(encoding="utf-8")
          match = re.search(
              r"project\(DroneSwarmSensorFusion\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)\s+LANGUAGES",
              cmake,
          )
          if match is None:
              raise SystemExit("Could not determine project version from CMakeLists.txt")

          version = match.group(1)
          expected_tag = f"v{version}"
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          research_release = Path("RESEARCH_RELEASE.md").read_text(encoding="utf-8")
          release_notes = Path("docs/releases") / f"{expected_tag}.md"

          if f"## [{version}]" not in changelog:
              raise SystemExit(f"CHANGELOG.md is missing the {version} release heading")
          if expected_tag not in research_release:
              raise SystemExit(f"RESEARCH_RELEASE.md is not aligned with {expected_tag}")
          if not release_notes.is_file():
              raise SystemExit(f"Missing versioned release notes: {release_notes}")

          ref = os.environ.get("RELEASE_REF", "")
          ref_name = os.environ.get("RELEASE_REF_NAME", "")
          if ref.startswith("refs/tags/") and ref_name != expected_tag:
              raise SystemExit(
                  f"Release tag {ref_name!r} does not match project version {expected_tag!r}"
              )

          print(f"release_version={version}")
          print(f"expected_tag={expected_tag}")
          print(f"release_notes={release_notes}")
          PY

  linux-package:
    name: Linux Release Package
    needs: release-metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/setup-linux-deps
      - name: Print tool versions
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          gcc --version | head -n 1
          cmake --version
          echo "preset=linux-gcc-release-package"
          echo "commit_sha=${GITHUB_SHA}"
      - name: Configure
        shell: bash
        run: cmake --preset linux-gcc-release-package
      - name: Build
        shell: bash
        run: cmake --build --preset linux-gcc-release-package
      - name: Test
        shell: bash
        run: ctest --preset linux-gcc-release-package --output-on-failure --output-junit "${RUNNER_TEMP}/linux-release-junit.xml"
      - name: Install
        shell: bash
        run: cmake --install build/linux-gcc-release-package --prefix "${RUNNER_TEMP}/linux-install"
      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "${RUNNER_TEMP}/release/linux"
          cpack --config build/linux-gcc-release-package/CPackConfig.cmake --verbose -B "${RUNNER_TEMP}/release/linux"
          test -n "$(find "${RUNNER_TEMP}/release/linux" -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.zip' \) -print -quit)"
          rm -rf "${RUNNER_TEMP}/release/linux/_CPack_Packages"
      - name: Validate downstream consumer
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/package_consumer_smoke.py \
            --install-prefix "${RUNNER_TEMP}/linux-install" \
            --manifest-out "${RUNNER_TEMP}/release/linux/install-manifest.json"
      # Syft v1.22.0 needs Go 1.24.1+; retain go.mod's older application requirement.
      - name: Set up SBOM toolchain
        uses: actions/setup-go@v7
        with:
          go-version: "1.24.1"
          cache: false
      - name: Install syft
        shell: bash
        run: |
          set -euxo pipefail
          go version
          go install github.com/anchore/syft/cmd/syft@v1.22.0
          echo "${HOME}/go/bin" >> "${GITHUB_PATH}"
      - name: Generate SBOM and checksums
        shell: bash
        run: |
          set -euxo pipefail
          syft "dir:${RUNNER_TEMP}/linux-install" -o cyclonedx-json="${RUNNER_TEMP}/release/linux/sbom.cdx.json"
          (
            cd "${RUNNER_TEMP}/release/linux"
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z | xargs -0 -r sha256sum > "${RUNNER_TEMP}/release-linux-sha256.txt"
            test -s "${RUNNER_TEMP}/release-linux-sha256.txt"
            mv "${RUNNER_TEMP}/release-linux-sha256.txt" SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
          python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"release/linux/sbom.cdx.json"; d=json.loads(p.read_text()); assert d.get("bomFormat")=="CycloneDX"; assert isinstance(d.get("components",[]),list); print("Release SBOM validated")'
      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release/linux
            ${{ runner.temp }}/linux-release-junit.xml
          retention-days: 30

  windows-package:
    name: Windows Release Package
    needs: release-metadata
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-key-suffix: release-package
      - name: Print tool versions
        shell: pwsh
        run: |
          cmake --version
          ctest --version
          $cl = Get-Command cl.exe -ErrorAction SilentlyContinue
          if ($cl) {
            cmd /c cl 2>&1 | Select-Object -First 1
          } else {
            Write-Host "cl.exe not on PATH before configure; Visual Studio generator will resolve the toolchain during configure."
          }
          Write-Host "preset=windows-msvc-release-package"
          Write-Host "commit_sha=$env:GITHUB_SHA"
      - name: Configure
        shell: pwsh
        run: cmake --preset windows-msvc-release-package -DDRONE_ENABLE_PYTHON_BINDINGS=OFF
      - name: Build
        shell: pwsh
        run: cmake --build --preset windows-msvc-release-package --parallel
      - name: Test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\release\windows" | Out-Null
          ctest --preset windows-msvc-release-package --parallel 2 --output-on-failure --output-junit "$env:RUNNER_TEMP\release\windows\junit.xml"
      - name: Install
        shell: pwsh
        run: cmake --install build/windows-msvc-release-package --config Release --prefix "$env:RUNNER_TEMP\windows-install"
      - name: Package
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\release\windows"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          cpack --config build/windows-msvc-release-package\CPackConfig.cmake --verbose -B $out
          if ($LASTEXITCODE -ne 0) { throw "CPack Windows release failed" }
          $archives = @(Get-ChildItem -LiteralPath $out -File -Filter "*.zip")
          if ($archives.Count -eq 0) { throw "CPack produced no Windows ZIP package" }
          $staging = Join-Path $out "_CPack_Packages"
          if (Test-Path -LiteralPath $staging) { Remove-Item -LiteralPath $staging -Recurse -Force }
      - name: Generate checksums
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\release\windows"
          $artifacts = @(Get-ChildItem -LiteralPath $out -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" })
          if ($artifacts.Count -eq 0) { throw "Windows release artifacts are missing" }
          $lines = foreach ($artifact in $artifacts) {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $artifact.FullName
            "$($hash.Hash)  $($artifact.Name)"
          }
          $lines | Set-Content -LiteralPath (Join-Path $out "SHA256SUMS.txt") -Encoding ascii
          foreach ($artifact in $artifacts) {
            $expected = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact.FullName).Hash
            if (-not ($lines | Where-Object { $_ -eq "$expected  $($artifact.Name)" })) {
              throw "Checksum verification failed: $($artifact.Name)"
            }
          }
      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ github.sha }}
          path: ${{ runner.temp }}\release\windows
          retention-days: 30

  publish-release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - linux-package
      - windows-package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/release-bundle

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euxo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"
          NOTES_FILE="docs/releases/${TAG_NAME}.md"
          test -f "${NOTES_FILE}"
          mkdir -p "${RUNNER_TEMP}/release-upload"
          while IFS= read -r -d '' source_file; do
            relative="${source_file#"${RUNNER_TEMP}/release-bundle/"}"
            case "${relative}" in
              release-linux-*) prefix=linux ;;
              release-windows-*) prefix=windows ;;
              *) echo "Unexpected release artifact: ${relative}" >&2; exit 1 ;;
            esac
            cp -- "${source_file}" "${RUNNER_TEMP}/release-upload/${prefix}-${source_file##*/}"
          done < <(find "${RUNNER_TEMP}/release-bundle" -type f -print0)
          mapfile -d '' -t release_files < <(find "${RUNNER_TEMP}/release-upload" -maxdepth 1 -type f -print0)
          test "${#release_files[@]}" -gt 0
          if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber "${release_files[@]}"
          else
            gh release create "${TAG_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TAG_NAME}" \
              --notes-file "${NOTES_FILE}" \
              "${release_files[@]}"
          fi
