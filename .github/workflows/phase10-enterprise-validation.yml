name: Phase 10 Enterprise Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/phase10-enterprise-validation.yml"
      - "deployment/**"
      - "docker-compose.production.yml"
      - "Dockerfile"
      - "internal/controlplane/**"
      - "cmd/control-plane/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Lint Python entrypoints
        run: python -m compileall scripts deployment/scripts

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build control-plane
        run: go build ./...

  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Run Go tests
        run: go test ./...

  integration-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose stacks
        run: |
          docker compose -f docker-compose.yml config
          docker compose -f docker-compose.production.yml config

  security-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run Phase 10 security audit
        run: python deployment/scripts/phase10_security_audit.py

  performance-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Measure control-plane performance on Linux
        run: python scripts/phase10_performance_validation.py
      - name: Archive actual measurements and backend log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase10-linux-performance-${{ github.sha }}
          path: |
            docs/performance-engineering-stability-validation/linux_ci_performance.json
            docs/performance-engineering-stability-validation/linux_ci_backend.log
          if-no-files-found: warn
          retention-days: 14

  packaging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            log="${RUNNER_TEMP}/production-image-build-${attempt}.log"
            if docker build -f deployment/docker/Dockerfile.production \
                -t drone-swarm/control-plane:phase10 . 2>&1 | tee "$log"; then
              exit 0
            fi
            if ! grep -Eqi '503 Service Unavailable|502 Bad Gateway|504 Gateway Timeout|429 Too Many Requests|TLS handshake timeout|connection reset by peer|i/o timeout' "$log"; then
              echo "Docker build failed for a non-transient reason; not retrying."
              exit 1
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Docker registry/network error persisted after three attempts."
              exit 1
            fi
            echo "Transient registry/network error; retrying the production build."
            sleep "$((attempt * 20))"
          done

  release-validation:
    runs-on: ubuntu-24.04
    needs:
      - lint
      - build
      - unit-tests
      - integration-tests
      - security-scan
      - performance-validation
      - packaging
    steps:
      - uses: actions/checkout@v7
      - name: Upload release metadata
        uses: actions/upload-artifact@v7
        with:
          name: phase10-enterprise-validation
          path: |
            docs/phase10
            deployment
