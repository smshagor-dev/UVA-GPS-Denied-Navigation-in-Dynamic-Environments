name: MSCKF Retirement Integration Runner

on:
  pull_request:
    branches:
      - phase22-final-validation
    paths:
      - '.github/msckf-retirement-trigger.txt'
      - '.github/workflows/msckf-retirement-pr-runner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply production integration patch
        run: python3 scripts/integrate_msckf_retirement.py

      - name: Install focused dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libeigen3-dev libspdlog-dev libfmt-dev libboost-all-dev

      - name: GCC warnings-as-errors syntax validation
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -fsyntax-only \
            -Iinclude -Ithird_party/crypto -I/usr/include/eigen3 \
            src/vio/Phase17ESKFEstimator.cpp

      - name: Clang warnings-as-errors syntax validation
        run: |
          clang++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -fsyntax-only \
            -Iinclude -Ithird_party/crypto -I/usr/include/eigen3 \
            src/vio/Phase17ESKFEstimator.cpp

      - name: Commit production integration to PR head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/vio/EKFEstimator.hpp include/vio/StateEstimator.hpp \
                  src/vio/Phase17ESKFEstimator.cpp tests/CMakeLists.txt \
                  tests/test_msckf_marginalization_integration.cpp
          if git diff --cached --quiet; then
            echo "No integration changes required"
            exit 0
          fi
          git commit -m "Wire MSCKF marginalization retirement boundary"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
